<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="670" height="685" viewBox="0 0 670 685" fill="none">
  <title>Cosmos agency luminous ring</title>
  <desc>Black circular core surrounded by a soft white halo on a transparent background.</desc>

  <defs>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(335 342.5) rotate(90) scale(323 316)">
      <stop offset="0.685" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.715" stop-color="#FFFFFF" stop-opacity="0.98"/>
      <stop offset="0.755" stop-color="#FFFFFF" stop-opacity="0.92"/>
      <stop offset="0.835" stop-color="#F8F8F8" stop-opacity="0.68"/>
      <stop offset="0.915" stop-color="#DADADA" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#BEBEBE" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="core" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(335 342.5) rotate(90) scale(237 232)">
      <stop offset="0.91" stop-color="#000000"/>
      <stop offset="0.975" stop-color="#020202"/>
      <stop offset="1" stop-color="#222222"/>
    </radialGradient>

    <filter id="wideGlow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="edgeGlow" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="4.5"/>
    </filter>
  </defs>

  <!-- No background rectangle: everything outside the halo is transparent. -->
  <ellipse cx="335" cy="342.5" rx="286" ry="294" fill="#D8D8D8" opacity="0.28" filter="url(#wideGlow)"/>
  <ellipse cx="335" cy="342.5" rx="274" ry="282" fill="#FFFFFF" opacity="0.55" filter="url(#softGlow)"/>
  <ellipse cx="335" cy="342.5" rx="323" ry="330" fill="url(#halo)"/>
  <ellipse cx="335" cy="342.5" rx="240" ry="246" fill="none" stroke="#FFFFFF" stroke-width="16" opacity="0.92" filter="url(#edgeGlow)"/>
  <ellipse cx="335" cy="342.5" rx="232" ry="237" fill="url(#core)"/>
</svg>
